apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: microservices-auth
  labels:
    app: restaurant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      containers:
        - name: restaurant-service
          image: restaurant-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service-service
  namespace: microservices-auth
  labels:
    app: restaurant-service
spec:
  selector:
    app: restaurant-service
  ports:
    - port: 8082
      targetPort: 8082
  type: NodePort
