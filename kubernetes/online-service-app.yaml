apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-service-app
  namespace: microservices-auth
  labels:
    app: online-service-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: online-service-app
  template:
    metadata:
      labels:
        app: online-service-app
    spec:
      containers:
        - name: online-service-app
          image: online-service-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: online-service-app-service
  namespace: microservices-auth
  labels:
    app: online-service-app
spec:
  selector:
    app: online-service-app
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
